<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CalAccrue — Prototype</title>
<style>
  :root {
    --page: #eceef2;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --faint: #b8b8be;
    --card: #ffffff;
    --card-border: rgba(0,0,0,.08);
    --menubar: rgba(246,246,248,.78);
    --menubar-text: #1d1d1f;
    --menubar-hi: rgba(0,0,0,.12);
    --pop: rgba(250,250,252,.86);
    --pop-border: rgba(0,0,0,.14);
    --pop-solid: #f6f6f8;
    --sep: rgba(0,0,0,.09);
    --hover: rgba(0,0,0,.05);
    --accent: #0a84ff;
    --done: #30b158;
    --done-soft: rgba(48,177,88,.18);
    --partial: #f5a623;
    --missed: #e5484d;
    --missed-soft: rgba(229,72,77,.14);
    --flame: #ff7a1a;
    --wall: linear-gradient(135deg,#9cc3ff 0%,#c9b6ff 45%,#ffc6a8 100%);
    --shadow: 0 18px 50px rgba(0,0,0,.22), 0 2px 8px rgba(0,0,0,.08);
  }
  body.dark {
    --page: #141416;
    --text: #f5f5f7;
    --muted: #98989f;
    --faint: #55555b;
    --card: #1e1e21;
    --card-border: rgba(255,255,255,.08);
    --menubar: rgba(30,30,34,.72);
    --menubar-text: #f5f5f7;
    --menubar-hi: rgba(255,255,255,.18);
    --pop: rgba(40,40,44,.86);
    --pop-border: rgba(255,255,255,.14);
    --pop-solid: #2c2c30;
    --sep: rgba(255,255,255,.1);
    --hover: rgba(255,255,255,.07);
    --accent: #0a84ff;
    --done: #32d74b;
    --done-soft: rgba(50,215,75,.2);
    --partial: #ffb340;
    --missed: #ff6961;
    --missed-soft: rgba(255,105,97,.16);
    --wall: linear-gradient(135deg,#1c2a4a 0%,#3a2557 50%,#5a2f2a 100%);
    --shadow: 0 18px 50px rgba(0,0,0,.6), 0 2px 8px rgba(0,0,0,.4);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--text);
    font: 13px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header.page {
    max-width: 1280px; margin: 0 auto; padding: 32px 28px 8px;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 24px;
  }
  header.page h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: -.02em; }
  header.page p { margin: 0; color: var(--muted); max-width: 720px; font-size: 14px; }
  .mode-toggle {
    flex: none; border: 1px solid var(--card-border); background: var(--card); color: var(--text);
    border-radius: 999px; padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .mode-toggle:hover { background: var(--hover); }
  .concept { background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
  .concept-head { padding: 16px 18px 12px; }
  .concept-head .num { font-size: 11px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }
  .concept-head h2 { margin: 2px 0 4px; font-size: 17px; letter-spacing: -.01em; }
  .concept-head p { margin: 0; color: var(--muted); }
  .desk { background: var(--wall); position: relative; min-height: 560px; padding-bottom: 24px; }
  .menubar {
    height: 26px; background: var(--menubar); backdrop-filter: blur(20px) saturate(1.6); -webkit-backdrop-filter: blur(20px) saturate(1.6);
    display: flex; align-items: center; justify-content: space-between; padding: 0 8px; color: var(--menubar-text);
    font-size: 13px; position: relative; z-index: 2;
  }
  .mb-left, .mb-right { display: flex; align-items: center; gap: 2px; }
  .mb-left span { padding: 0 7px; }
  .mb-left b { padding: 0 7px; }
  .mb-item { height: 22px; display: inline-flex; align-items: center; padding: 0 7px; border-radius: 5px; gap: 5px; white-space: nowrap; }
  .mb-item.app-item { background: var(--menubar-hi); font-weight: 500; font-variant-numeric: tabular-nums; }
  .mb-item svg { display:block; }
  .popover {
    position: absolute; top: 31px; right: 64px; width: 300px; background: var(--pop);
    backdrop-filter: blur(30px) saturate(1.8); -webkit-backdrop-filter: blur(30px) saturate(1.8);
    border: 1px solid var(--pop-border); border-radius: 12px; box-shadow: var(--shadow); padding: 10px; z-index: 3;
  }
  .sep { height: 1px; background: var(--sep); margin: 8px -10px; }
  .notes { padding: 12px 18px 16px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--card-border); }
  .notes b { color: var(--text); font-weight: 600; }
  .notes ul { margin: 4px 0 0; padding-left: 16px; }

  /* Shared calendar */
  .cal-head { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 6px; }
  .cal-head .title { font-weight: 700; font-size: 13px; }
  .cal-nav { display: flex; gap: 2px; }
  .cal-nav button, .icon-btn {
    border: 0; background: transparent; color: var(--text); width: 22px; height: 22px; border-radius: 5px; cursor: pointer; font: inherit; font-size: 13px; line-height: 1;
  }
  .cal-nav button:hover, .icon-btn:hover { background: var(--hover); }
  .cal-nav button.today-dot { font-size: 9px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 2px; text-align: center; }
  .grid .dow { font-size: 10px; font-weight: 600; color: var(--muted); padding-bottom: 3px; }
  .day { position: relative; height: 34px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 3px; font-variant-numeric: tabular-nums; border-radius: 6px; }
  .day.other { color: var(--faint); }
  .day .n { width: 22px; height: 22px; line-height: 22px; border-radius: 50%; font-size: 12px; }
  .day.today .n { background: var(--accent); color: #fff; font-weight: 700; }
  /* Habit strips */
  .rows { display: flex; flex-direction: column; gap: 9px; padding: 2px 4px 2px; }
  .row-top { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .row-top .nm { font-weight: 600; }
  .strip { display: grid; grid-template-columns: repeat(31, 1fr); gap: 2px; }
  .sq { aspect-ratio: 1; border-radius: 2px; background: var(--sep); opacity: .55; }
  .sq.due { opacity: 1; background: var(--missed-soft); }
  .sq.done { opacity: 1; background: var(--done); }
  .sq.future { opacity: 1; background: transparent; box-shadow: inset 0 0 0 1px var(--sep); }
  .sq.future.due { box-shadow: inset 0 0 0 1px var(--faint); }
  .sq.today { outline: 1.5px solid var(--accent); outline-offset: 1px; cursor: pointer; }
  .sq.past.due, .sq.past.done { cursor: pointer; }
  .empty { color: var(--muted); padding: 6px 4px; font-size: 12px; }
  .section-label { font-size: 11px; font-weight: 600; color: var(--muted); padding: 2px 4px 4px; text-transform: uppercase; letter-spacing: .04em; display:flex; justify-content:space-between; }
  .foot { display: flex; justify-content: space-between; align-items: center; padding: 0 2px; }
  .link { border: 0; background: transparent; color: var(--accent); font: inherit; cursor: pointer; padding: 3px 4px; border-radius: 5px; }
  .link:hover { background: var(--hover); }
  .grid.compact .day { height: 24px; }
  .grid.compact .day .n { width: 20px; height: 20px; line-height: 20px; font-size: 11px; }


  /* Final */
  .final-wrap { max-width: 1280px; margin: 20px auto 0; padding: 0 28px; }
  .final { border: 2px solid var(--accent); }
  .final .desk { min-height: 600px; }
  .final .popover { width: 330px; right: 12px; }
  .ph { display: inline-block; vertical-align: -0.15em; flex: none; }
  .final .cal-nav button { display: grid; place-items: center; color: var(--muted); }
  .final .cal-nav button:hover { color: var(--text); }
  .hrow { display: flex; flex-direction: column; gap: 5px; }
  .hrow-top { display: flex; align-items: center; gap: 8px; }
  .hicon { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: var(--hover); color: var(--text); flex: none; }
  .hrow-top .stat + .stat { margin-left: 6px; }
  .hrow-top .nm { flex: 1; min-width: 0; font-weight: 600; line-height: 1.2; }
  .hrow-top .nm small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }
  .stat { display: inline-flex; align-items: center; gap: 2px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stat.hot { color: var(--flame); font-weight: 600; }
  .tick { width: 24px; height: 24px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer; background: transparent; box-shadow: inset 0 0 0 1.5px var(--faint); color: transparent; flex: none; padding: 0; }
  .tick:hover { box-shadow: inset 0 0 0 1.5px var(--done); color: var(--done); }
  .tick.on { background: var(--done); box-shadow: none; color: #fff; }
  .tick.rest { cursor: default; box-shadow: none; border: 1.5px dashed var(--faint); }
  .final .strip { margin-left: 32px; }
  .final .rows { gap: 12px; }
  .final .foot .link { display: inline-flex; align-items: center; gap: 4px; }
  .final .icon-btn { display: grid; place-items: center; color: var(--muted); }


  /* Final: edit habit */
  .hrow-top .nm { cursor: pointer; }
  .hrow-top .nm .pen { opacity: 0; color: var(--muted); margin-left: 4px; transition: opacity .1s; }
  .hrow-top .nm:hover .pen { opacity: 1; }
  .hrow-top .nm:hover > span:first-child { text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 2px; }
  .ed-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 0 10px; }
  .ed-head .ttl { font-weight: 700; }
  .ed-head .link:first-child { justify-self: start; }
  .ed-head .link:last-child { justify-self: end; font-weight: 600; }
  .ed-head .link:disabled { color: var(--faint); cursor: default; background: transparent; }
  .field-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 0 2px 5px; }
  .ed-name { width: 100%; font: inherit; font-size: 14px; color: var(--text); background: var(--hover); border: 1px solid var(--sep); border-radius: 7px; padding: 7px 9px; outline: none; margin-bottom: 14px; }
  .ed-name:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(10,132,255,.25); }
  .wd { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-bottom: 8px; }
  .wd button { aspect-ratio: 1; border-radius: 50%; border: 1px solid var(--sep); background: transparent; color: var(--text); font: inherit; font-weight: 600; font-size: 12px; cursor: pointer; padding: 0; }
  .wd button:hover { background: var(--hover); }
  .wd button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .ed-note { width: 100%; font: inherit; font-size: 13px; line-height: 1.4; color: var(--text); background: var(--hover); border: 1px solid var(--sep); border-radius: 7px; padding: 7px 9px; outline: none; resize: none; margin-bottom: 12px; display: block; }
  .ed-note:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(10,132,255,.25); }
  .wd { margin-bottom: 14px !important; }
  .hint { font-size: 11.5px; color: var(--muted); padding: 0 2px 12px; }
  .danger { width: 100%; border: 0; border-radius: 7px; padding: 7px; background: var(--missed-soft); color: var(--missed); font: inherit; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .danger:hover { filter: brightness(1.05); }
  .confirm { background: var(--missed-soft); border-radius: 8px; padding: 10px; }
  .confirm p { margin: 0 0 4px; font-weight: 600; }
  .confirm small { display: block; color: var(--muted); margin-bottom: 10px; }
  .confirm .btns { display: flex; gap: 6px; justify-content: flex-end; }
  .confirm .btns button { border: 0; border-radius: 6px; padding: 5px 12px; font: inherit; cursor: pointer; background: var(--hover); color: var(--text); }
  .confirm .btns button.del { background: var(--missed); color: #fff; font-weight: 600; }
  .ctx { position: absolute; z-index: 10; min-width: 150px; background: var(--pop); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border: 1px solid var(--pop-border); border-radius: 8px; box-shadow: var(--shadow); padding: 4px; }
  .ctx button { display: flex; width: 100%; align-items: center; gap: 8px; border: 0; background: transparent; color: var(--text); font: inherit; text-align: left; padding: 4px 8px; border-radius: 5px; cursor: default; }
  .ctx button:hover { background: var(--accent); color: #fff; }
  .ctx .sep { margin: 4px 0; }


  /* Habit form screens */
  .screens-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; overflow: hidden; }
  .screens { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--card-border); }
  @media (max-width: 1100px) { .screens { grid-template-columns: repeat(2, 1fr); } }
  .screen .cap { min-height: 74px; }
  .screen .desk { overflow: hidden; }
  .screen .mb-left span, .screen .mb-right .mb-item:first-child { display: none; }
  .screen { background: var(--card); display: flex; flex-direction: column; }
  .screen .cap { padding: 12px 16px 10px; }
  .screen .cap b { display: block; font-size: 13px; }
  .screen .cap span { color: var(--muted); font-size: 12px; }
  .screen .desk { min-height: 0; flex: 1; padding: 0 0 22px; }
  .screen .popover { position: relative; top: auto; right: auto; margin: 6px 14px 0 auto; width: 290px; pointer-events: none; }


  /* Final: settings */
  .set-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 0 10px; }
  .set-head .ttl { font-weight: 700; }
  .set-head .link { justify-self: start; display: inline-flex; align-items: center; gap: 2px; }
  .set-group { background: var(--hover); border-radius: 8px; margin-bottom: 12px; }
  .set-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px; min-height: 38px; }
  .set-row + .set-row { border-top: 1px solid var(--sep); }
  .set-row small { display: block; color: var(--muted); font-size: 11px; }
  .switch { width: 32px; height: 19px; border-radius: 999px; border: 0; padding: 0; background: var(--faint); position: relative; cursor: pointer; flex: none; transition: background .15s; }
  .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: left .15s; }
  .switch.on { background: var(--done); }
  .switch.on::after { left: 15px; }
  .seg { display: inline-flex; background: var(--sep); border-radius: 7px; padding: 2px; flex: none; }
  .seg button { border: 0; background: transparent; color: var(--text); font: inherit; font-size: 12px; padding: 3px 10px; border-radius: 5px; cursor: pointer; }
  .seg button.on { background: var(--card); box-shadow: 0 1px 2px rgba(0,0,0,.18); font-weight: 600; }
  .about { text-align: center; color: var(--muted); font-size: 12px; padding: 0 0 14px; line-height: 1.5; }
  .about a { color: var(--accent); text-decoration: none; }
  .about a:hover { text-decoration: underline; }
  .set-row small .link { padding: 0; font-size: 11px; }
  .about b { color: var(--text); font-size: 15px; }
  .quit { width: 100%; border: 0; border-radius: 7px; padding: 7px 10px; background: var(--hover); color: var(--text); font: inherit; cursor: pointer; display: flex; align-items: center; gap: 8px; }
  .quit:hover { background: var(--sep); }
  .quit kbd { margin-left: auto; font: inherit; color: var(--muted); }

  /* Icon lab */
  .lab { max-width: 1280px; margin: 20px auto 0; padding: 0 28px; }
  .lab-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; padding: 16px 18px 18px; }
  .lab-card h2 { margin: 2px 0 4px; font-size: 17px; }
  .lab-card > p { margin: 0 0 14px; color: var(--muted); }
  .lab-row { display: flex; flex-wrap: wrap; gap: 14px; align-items: stretch; }
  .lab-bars { display: flex; flex-direction: column; gap: 10px; min-width: 300px; flex: 1; }
  .lab-bar { border-radius: 8px; overflow: hidden; background: var(--wall); }
  .lab-bar .menubar { border-radius: 0; }
  .lab-bar.light .menubar { background: rgba(246,246,248,.82); color: #1d1d1f; --menubar-hi: rgba(0,0,0,.12); }
  .lab-bar.dark .menubar { background: rgba(30,30,34,.78); color: #f5f5f7; --menubar-hi: rgba(255,255,255,.18); }
  .lab-bar .cap { font-size: 11px; color: var(--muted); padding: 4px 8px; background: var(--card); }
  .zooms { display: flex; gap: 10px; flex-wrap: wrap; }
  .zoom { width: 96px; border-radius: 12px; border: 1px solid var(--card-border); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 14px 6px 10px; }
  .zoom.light { background: #f3f3f5; color: #1d1d1f; }
  .zoom.dark { background: #26262a; color: #f5f5f7; }
  .zoom span { font-size: 11px; opacity: .7; text-align: center; }
  .zoom.live { box-shadow: 0 0 0 2px var(--accent); }
</style>
</head>
<body>
<header class="page">
  <div>
    <h1>CalAccrue — prototype</h1>
    <p>The menu bar icon, the popover, and its screens. Sample habits are Push-ups (every day), Run (Fri &amp; Sun), and Meditate (weekdays). The Final card is live: check off habits, change months, edit habits, and open Settings with the gear.</p>
  </div>
  <button class="mode-toggle" id="modeToggle" type="button"><span id="modeIcon">☾</span><span id="modeLabel">Dark mode</span></button>
</header>
<div class="lab" id="lab"></div>
<div class="final-wrap" id="final"></div>
<div class="final-wrap" id="screens"></div>

<script>
// ---------- Data ----------
const DAY = 86400000;
const now = new Date();
const TODAY = new Date(now.getFullYear(), now.getMonth(), now.getDate());
const key = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const sameDay = (a, b) => key(a) === key(b);
const DOW = ['S','M','T','W','T','F','S'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const WEEKDAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const SHORT_WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const SHORT_MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const habits = [
  { id: 'push', name: 'Push-ups', days: [0,1,2,3,4,5,6], label: 'Every day', icon: 'barbell', note: '3 sets of 20' },
  { id: 'run',  name: 'Run',      days: [5,0],           label: 'Fri, Sun', icon: 'person-simple-run', note: '5k loop around the park' },
  { id: 'med',  name: 'Meditate', days: [1,2,3,4,5],     label: 'Weekdays', icon: 'flower-lotus', note: '10 minutes before work' },
];
const HISTORY_DAYS = 150;
const START = addDays(TODAY, -HISTORY_DAYS);
const done = new Set();
// A habit's schedule can change. Each change applies from its date onward, so past days are
// judged by the schedule that was in force then. A habit isn't due before its first entry.
habits.forEach(h => h.schedule = [{ from: new Date(2000, 0, 1), days: h.days }]);
const daysOn = (h, d) => { let r = null; for (const e of h.schedule) if (e.from <= d) r = e.days; return r || []; };
const isDue = (h, d) => daysOn(h, d).includes(d.getDay());
const WEEK_ORDER = [1, 2, 3, 4, 5, 6, 0];
function scheduleLabel(days) {
  const set = [...new Set(days)].sort();
  if (set.length === 7) return 'Every day';
  if (set.join() === '1,2,3,4,5') return 'Weekdays';
  if (set.join() === '0,6') return 'Weekends';
  return WEEK_ORDER.filter(d => set.includes(d)).map(d => SHORT_WD[d]).join(', ');
}
const isDone = (h, d) => done.has(h.id + '|' + key(d));

// Seed believable history: mostly done, with a recent unbroken run per habit.
(function seed() {
  const recentRun = { push: 12, run: 6, med: 4 };
  habits.forEach((h, hi) => {
    const dueBack = [];
    for (let i = 1; i <= HISTORY_DAYS; i++) { const d = addDays(TODAY, -i); if (isDue(h, d)) dueBack.push(d); }
    dueBack.forEach((d, idx) => {
      let ok;
      if (idx < recentRun[h.id]) ok = true;
      else if (idx === recentRun[h.id]) ok = false;
      else ok = ((hi * 7919 + idx * 104729 + 17) % 100) < 80;
      if (ok) done.add(h.id + '|' + key(d));
    });
  });
  if (isDue(habits[0], TODAY)) done.add('push|' + key(TODAY)); // one already done today
})();

function toggle(h, d) {
  if (d > TODAY || !isDue(h, d)) return;
  const k = h.id + '|' + key(d);
  done.has(k) ? done.delete(k) : done.add(k);
  renderAll();
}

// A streak counts consecutive *due* days completed. Days a habit isn't scheduled are skipped,
// and today doesn't break a streak until it's over.
function currentStreak(h) {
  let n = 0;
  for (let d = TODAY; d >= START; d = addDays(d, -1)) {
    if (!isDue(h, d)) continue;
    if (isDone(h, d)) n++;
    else if (sameDay(d, TODAY)) continue;
    else break;
  }
  return n;
}
function bestStreak(h) {
  let best = 0, run = 0;
  for (let d = START; d <= TODAY; d = addDays(d, 1)) {
    if (!isDue(h, d)) continue;
    if (isDone(h, d)) { run++; best = Math.max(best, run); }
    else if (!sameDay(d, TODAY)) run = 0;
  }
  return best;

function systemWeekStart() {

    const info = loc.getWeekInfo ? loc.getWeekInfo() : loc.weekInfo;
    if (info && info.firstDay) return info.firstDay === 1 ? 1 : 0;

}

// view: 'list', or { mode: 'edit' | 'add', id, name, days, confirm } while the habit form is open.
const finalState = { y: TODAY.getFullYear(), m: TODAY.getMonth(), view: 'list', ctx: null };
function openEditor(h) {
  finalState.ctx = null;
  finalState.view = h ? { mode: 'edit', id: h.id, name: h.name, note: h.note || '', days: [...h.days], confirm: false }
                      : { mode: 'add', id: null, name: '', note: '', days: [0, 1, 2, 3, 4, 5, 6], confirm: false };
  renderAll();
  const input = document.querySelector('#final .ed-name');
  if (input) { input.focus(); input.select(); }
}
function saveHabit(v) {
  const days = [...v.days].sort(), name = v.name.trim(), note = (v.note || '').trim();
  if (v.mode === 'add') {
    habits.push({ id: 'h' + Date.now(), name, note, days, label: scheduleLabel(days), schedule: [{ from: TODAY, days }] });
  } else {
    const h = habits.find(x => x.id === v.id);
    h.name = name;
    h.note = note;
    if (days.join() !== [...h.days].sort().join()) {
      // New schedule applies from today; earlier days keep the old one.
      h.schedule = h.schedule.filter(e => e.from < TODAY).concat({ from: TODAY, days });
      h.days = days; h.label = scheduleLabel(days);
      for (const k of [...done]) if (k.startsWith(h.id + '|') && k.endsWith(key(TODAY)) && !days.includes(TODAY.getDay())) done.delete(k);
    }
  }
  finalState.view = 'list';
  renderAll();
}
function deleteHabit(id) {
  const i = habits.findIndex(x => x.id === id);
  if (i >= 0) habits.splice(i, 1);
  for (const k of [...done]) if (k.startsWith(id + '|')) done.delete(k);
  finalState.view = 'list';
  renderAll();
}

function finalEditor(v) {
  const pop = el('<div class="popover"></div>');
  const valid = () => v.name.trim() && v.days.length;
  const head = el(`<div class="ed-head"><button class="link" data-a="cancel">Cancel</button><span class="ttl">${v.mode === 'add' ? 'New habit' : 'Edit habit'}</span><button class="link" data-a="save">${v.mode === 'add' ? 'Add' : 'Save'}</button></div>`);
  const saveBtn = head.querySelector('[data-a="save"]');
  saveBtn.disabled = !valid();
  head.querySelector('[data-a="cancel"]').onclick = () => { finalState.view = 'list'; renderAll(); };
  saveBtn.onclick = () => valid() && saveHabit(v);
  pop.append(head, el('<div class="field-label">Name</div>'));

  const input = el(`<input class="ed-name" type="text" placeholder="e.g. Push-ups" maxlength="40">`);
  input.value = v.name;
  input.oninput = () => { v.name = input.value; saveBtn.disabled = !valid(); };
  input.onkeydown = e => { if (e.key === 'Enter' && valid()) saveHabit(v); if (e.key === 'Escape') { finalState.view = 'list'; renderAll(); } };
  pop.append(input, el('<div class="field-label">Repeats on</div>'));

  const wd = el('<div class="wd"></div>');
  weekOrder().forEach(d => {
    const b = el(`<button class="${v.days.includes(d) ? 'on' : ''}" title="${WEEKDAYS[d]}">${DOW[d]}</button>`);
    b.onclick = () => { v.days = v.days.includes(d) ? v.days.filter(x => x !== d) : [...v.days, d]; renderAll(); };
    wd.append(b);
  });
  const notes = el('<textarea class="ed-note" rows="3" maxlength="280" placeholder="Optional details, e.g. 3 sets of 20, or the route you run"></textarea>');
  notes.value = v.note || '';
  notes.oninput = () => { v.note = notes.value; };
  pop.append(wd, el('<div class="field-label">Notes</div>'), notes);

  const summary = v.days.length ? scheduleLabel(v.days) : 'Pick at least one day';
  if (v.mode === 'edit') {
    const h = habits.find(x => x.id === v.id);
    const changed = [...v.days].sort().join() !== [...h.days].sort().join();
    if (!v.days.length) pop.append(el(`<div class="hint">${summary}.</div>`));
    else if (changed) pop.append(el('<div class="hint">The new schedule starts today. Past days, and your streak, keep the old one.</div>'));
    pop.append(el('<div class="sep"></div>'));
    if (!v.confirm) {
      const del = el(`<button class="danger">${ph('trash', 14)} Delete habit</button>`);
      del.onclick = () => { v.confirm = true; renderAll(); };
      pop.append(del);
    } else {
      const c = el(`<div class="confirm"><p>Delete “${h.name}”?</p><small>Its history and streaks are deleted too. This can't be undone.</small>
        <div class="btns"><button data-a="no">Cancel</button><button class="del" data-a="yes">Delete</button></div></div>`);
      c.querySelector('[data-a="no"]').onclick = () => { v.confirm = false; renderAll(); };
      c.querySelector('[data-a="yes"]').onclick = () => deleteHabit(h.id);
      pop.append(c);
    }
  } else {
    if (!v.days.length) pop.append(el(`<div class="hint">${summary}.</div>`));
  }
  return pop;
}


function finalSettings(opts = {}) {
  const pop = el('<div class="popover"></div>');
  const back = () => { finalState.view = 'list'; renderAll(); };
  const head = el(`<div class="set-head"><button class="link">${ph('caret-left', 13)} Back</button><span class="ttl">Settings</span><span></span></div>`);
  head.querySelector('.link').onclick = back;
  const group = el(`<div class="set-group">
      <div class="set-row"><span>Launch at login<small>Start CalAccrue when you log in to this Mac</small></span><button class="switch ${settings.launchAtLogin ? 'on' : ''}" role="switch" aria-checked="${settings.launchAtLogin}" title="Launch at login"></button></div>
      <div class="set-row"><span>Week starts on<small>${settings.weekStartOverride === null
          ? `From your Mac's settings`
          : `Your Mac uses ${WEEKDAYS[systemWeekStart()]} · <button class="link reset">Use Mac setting</button>`}</small></span><span class="seg"><button data-d="0" class="${settings.weekStart === 0 ? 'on' : ''}">Sunday</button><button data-d="1" class="${settings.weekStart === 1 ? 'on' : ''}">Monday</button></span></div>
    </div>`);
  group.querySelector('.switch').onclick = () => { settings.launchAtLogin = !settings.launchAtLogin; renderAll(); };
  group.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
    const d = +b.dataset.d;
    settings.weekStartOverride = d === systemWeekStart() && settings.weekStartOverride === null ? null : d;
    renderAll();
  });
  const reset = group.querySelector('.reset');
  if (reset) reset.onclick = () => { settings.weekStartOverride = null; renderAll(); };
  const about = el(`<div class="about"><b>CalAccrue 1.0</b><br><a href="https://www.muchfiner.com" target="_blank" rel="noopener">www.muchfiner.com</a></div>`);
  const quit = el(`<button class="quit">${ph('power', 15)} Quit CalAccrue <kbd>⌘Q</kbd></button>`);
  quit.onclick = () => { quit.querySelector('kbd').textContent = '(prototype: nothing to quit)'; };
  pop.append(head, about, el('<div class="field-label">General</div>'), group, el('<div class="sep"></div>'), quit);
  return pop;
}

function finalList(s) {
  const pop = el('<div class="popover"></div>');
  const head = el(`<div class="cal-head"><span class="title">${MONTHS[s.m]} ${s.y}</span>
    <span class="cal-nav"><button data-a="prev" title="Previous month">${ph('caret-left', 14)}</button><button data-a="today" title="Today">${ph('calendar-dot', 15)}</button><button data-a="next" title="Next month">${ph('caret-right', 14)}</button></span></div>`);
  head.querySelectorAll('button').forEach(b => b.onclick = () => {
    const a = b.dataset.a;
    if (a === 'today') { s.y = TODAY.getFullYear(); s.m = TODAY.getMonth(); }
    else { const d = new Date(s.y, s.m + (a === 'next' ? 1 : -1), 1); s.y = d.getFullYear(); s.m = d.getMonth(); }
    renderAll();
  });
  pop.append(head, grid(s, d => el(`<div class="day"><span class="n">${d.getDate()}</span></div>`), 'compact'));

  pop.append(el('<div class="sep"></div>'), el('<div class="section-label"><span>Habits</span></div>'));
  const rows = el('<div class="rows"></div>');
  if (!habits.length) rows.append(el('<div class="empty">No habits yet. Add one to start a streak.</div>'));
  const daysIn = new Date(s.y, s.m + 1, 0).getDate();
  habits.forEach(h => {
    const cur = currentStreak(h), dueT = isDue(h, TODAY), onT = isDone(h, TODAY);
    const r = el(`<div class="hrow"><div class="hrow-top">
        ${dueT ? `<button class="tick ${onT ? 'on' : ''}" title="${onT ? 'Done today — click to undo' : 'Mark done today'}">${ph('check', 13)}</button>` : '<span class="tick rest" title="Not scheduled today"></span>'}
        <span class="nm" title="Edit habit"><span>${h.name}</span><span class="pen">${ph('pencil-simple', 12)}</span><small>${h.label}</small></span>
        <span class="stat ${cur >= 3 ? 'hot' : ''}" title="Current streak">${ph('fire', 13)}${cur}</span>
        <span class="stat" title="Best streak">${ph('trophy', 13)}${bestStreak(h)}</span>
      </div><div class="strip"></div></div>`);
    const t = r.querySelector('button.tick');
    if (t) t.onclick = () => toggle(h, TODAY);
    r.querySelector('.nm').onclick = () => openEditor(h);
    r.oncontextmenu = e => {
      e.preventDefault();
      const desk = r.closest('.desk').getBoundingClientRect();
      finalState.ctx = { id: h.id, x: e.clientX - desk.left, y: e.clientY - desk.top };
      renderAll();
    };
    const strip = r.querySelector('.strip');
    for (let i = 1; i <= 31; i++) {
      if (i > daysIn) { strip.append(el('<span></span>')); continue; }
      const d = new Date(s.y, s.m, i);
      const due = isDue(h, d), fut = d > TODAY, on = isDone(h, d);
      const c = ['sq', due ? 'due' : '', on ? 'done' : '', fut ? 'future' : 'past', sameDay(d, TODAY) ? 'today' : ''].join(' ');
      const sq = el(`<span class="${c}" title="${SHORT_MO[s.m]} ${i}${due ? (fut ? '' : on ? ' · done' : ' · missed') : ' · not scheduled'}"></span>`);
      if (due && !fut) sq.onclick = () => toggle(h, d);
      strip.append(sq);
    }
    rows.append(r);
  });
  const foot = el(`<div class="foot"><button class="link">${ph('plus', 14)} Add habit</button><button class="icon-btn" title="Settings">${ph('gear-six', 16)}</button></div>`);
  foot.querySelector('.link').onclick = () => openEditor(null);
  foot.querySelector('.icon-btn').onclick = () => { finalState.view = 'settings'; finalState.ctx = null; renderAll(); };
  pop.append(rows, el('<div class="sep"></div>'), foot);
  return pop;
}

function renderFinal() {
  const s = finalState;
  const wrap = document.getElementById('final');
  wrap.innerHTML = '';
  const card = el(`<section class="concept final"><div class="concept-head"><div class="num">Final</div><h2>Habit Rows + tear-off calendar icon</h2>
    <p>Concept 3's popover under the locked menu bar icon, with icons from Phosphor. Each habit row starts with its done button for today, and its streaks sit on the right.</p></div>
    <div class="desk"></div>
    <div class="notes"><ul>
      <li><b>Today:</b> click the round button at the start of a habit's row. On a day the habit isn't scheduled, the button is a dashed circle.</li>
      <li><b>Fix a past day:</b> click any square in a habit's strip.</li>
      <li><b>Edit a habit:</b> click its name (a pencil appears on hover), or right-click the row for Edit / Delete. "+ Add habit" opens the same form, empty.</li>
      <li><b>Settings:</b> the gear opens the app name and website, Launch at login, Week starts on (it starts from your Mac's setting; picking the other day overrides it, and the calendar and the habit form's day buttons both reorder), and Quit — a menu bar app has no Dock icon, so Quit lives here.</li>
      <li><b>Changing a schedule</b> applies from today. Past days, and the streak through them, keep the old schedule.</li>
      <li><b>Streaks:</b> ${ph('fire', 12)} is the current streak and ${ph('trophy', 12)} is the best. A day the habit isn't scheduled never breaks the streak.</li>
      <li><b>Icons:</b> Phosphor, regular weight, to match SF Symbols' line style.</li>
    </ul></div></section>`);
  const desk = card.querySelector('.desk');
  desk.append(menubar(calIcon(TODAY)), s.view === 'list' ? finalList(s) : s.view === 'settings' ? finalSettings() : finalEditor(s.view));

  if (s.ctx && s.view === 'list') {
    const h = habits.find(x => x.id === s.ctx.id);
    const menu = el(`<div class="ctx" style="left:${s.ctx.x}px;top:${s.ctx.y}px">
      <button data-a="edit">${ph('pencil-simple', 14)} Edit…</button><div class="sep"></div><button data-a="del">${ph('trash', 14)} Delete…</button></div>`);
    menu.onclick = e => e.stopPropagation();
    menu.querySelector('[data-a="edit"]').onclick = () => openEditor(h);
    menu.querySelector('[data-a="del"]').onclick = () => { openEditor(h); finalState.view.confirm = true; renderAll(); };
    desk.append(menu);
  }
  wrap.append(card);
}
document.addEventListener('click', () => { if (finalState.ctx) { finalState.ctx = null; renderAll(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && finalState.ctx) { finalState.ctx = null; renderAll(); } });


// ---------- Habit form screens (static snapshots of the editor) ----------
function renderScreens() {
  const wrap = document.getElementById('screens');
  wrap.innerHTML = '';
  const run = { mode: 'edit', id: 'run', name: 'Run', note: '5k loop around the park', days: [0, 5], confirm: false };
  const shots = [
    ['Add habit', 'Opens from "+ Add habit". Starts empty and set to every day; Add stays greyed out until there is a name. Notes are optional.',
      { mode: 'add', id: null, name: '', note: '', days: [0, 1, 2, 3, 4, 5, 6], confirm: false }],
    ['Add habit, filled in', 'A name, the days it repeats, and a note with the details.',
      { mode: 'add', id: null, name: 'Stretch', note: 'Hamstrings and hips, 10 minutes after waking up', days: [1, 2, 3, 4, 5], confirm: false }],
    ['Edit habit', 'Opens from clicking a habit\'s name, or Edit… in its right-click menu.', run],
    ['Edit habit, schedule changed', 'A note explains that the change applies from today.',
      { ...run, days: [1, 3, 5] }],
    ['Delete habit', 'From the Delete button, or Delete… in the right-click menu. Asks first.',
      { ...run, confirm: true }],
  ];
  const card = el(`<div class="screens-card"><div class="concept-head"><div class="num">Final · Screens</div><h2>Add habit, Edit habit, and Settings</h2>
    <p>Each screen replaces the habit list inside the popover, then returns to it. One form covers adding and editing. These are static snapshots; try them live in the Final card above.</p></div>
    <div class="screens"></div></div>`);
  const grid = card.querySelector('.screens');
  shots.forEach(([title, cap, v]) => {
    if (v.mode === 'edit' && !habits.find(h => h.id === v.id)) return;
    const sc = el(`<div class="screen"><div class="cap"><b>${title}</b><span>${cap}</span></div><div class="desk"></div></div>`);
    sc.querySelector('.desk').append(menubar(calIcon(TODAY)), finalEditor({ ...v, days: [...v.days] }));
    grid.append(sc);
  });
  const st = el(`<div class="screen"><div class="cap"><b>Settings</b><span>Opens from the gear. Changes apply right away, so there's no Save; Back returns to the habits.</span></div><div class="desk"></div></div>`);
  st.querySelector('.desk').append(menubar(calIcon(TODAY)), finalSettings());
  grid.append(st);
  wrap.append(card);
}

// ---------- Render ----------
function renderAll() {
  renderLab();
  renderFinal();
  renderScreens();
}

// ---------- Light / dark ----------
const toggleBtn = document.getElementById('modeToggle');
function setMode(dark) {
  document.body.classList.toggle('dark', dark);
  document.getElementById('modeIcon').textContent = dark ? '☀︎' : '☾';
  document.getElementById('modeLabel').textContent = dark ? 'Light mode' : 'Dark mode';
}
toggleBtn.onclick = () => setMode(!document.body.classList.contains('dark'));
setMode(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
renderAll();
</script>
</body>
